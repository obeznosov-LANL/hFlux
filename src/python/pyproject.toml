[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hFlux"
version = "0.1.0"
description = "Pure-JAX implementation of hFlux interpolation routines"
authors = [
  { name = "Oleksii Beznosov", email = "obeznosov@lanl.gov" },
  { name = "Philipp Edelmann", email = "pedelmann@lanl.gov" },
  { name = "Jesus Bonilla", email = "jbonilla@lanl.gov" }
]
license = { text = "BSD-3" }
requires-python = ">=3.9"
dependencies = [
  "jax>=0.4.0",
  "jaxlib>=0.4.0",
  "numpy>=1.23"
]
keywords = ["jax", "interpolation", "magnetic-field", "hermite"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
]

[project.urls]
"Repository" = "https://github.com/obeznosov-LANL/hFlux"

[tool.setuptools.packages.find]
where = ["src"]
